<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>修习引导布局检查</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/ui.css">
<style>body{display:block;padding:16px;overflow:auto}main{display:flex;flex-wrap:wrap;gap:24px;align-items:start}.sample{width:680px;max-width:100%}.sample.narrow{width:390px}.sample .ability-panel{position:static;transform:none;width:100%;max-height:700px}.sample .ability-body{max-height:520px;overflow:auto;padding:12px}</style>
<h1>修习引导布局检查</h1><p>独立展示测试，不读取或修改游戏存档。按钮只用于检查引导定位。</p><main></main>
<script type="module">
import { mountAbilityGuide } from '../js/ui/abilityGuide.js';
for (const [name, className] of [['宽屏 680px', ''], ['窄屏 390px', 'narrow']]) {
 const sample=document.createElement('section');sample.className=`sample ${className}`;
 sample.innerHTML=`<h2>${name}</h2><div class="paper ability-panel"><h2>三功修习</h2><div class="ability-body"><h3>研修安排</h3><div class="ability-grid"><button class="opt" data-focus="shi">诗力 · 下阶段已选</button><button class="opt" data-focus="ci">词力</button></div><h3>分配心得 · 立即生效</h3><div class="ability-grid"><button class="opt" data-insight="shi">诗力 10 → 11 · 消耗 2 心得</button><button class="opt" data-insight="ci" disabled>心得不足</button></div></div></div>`;
 document.querySelector('main').append(sample);mountAbilityGuide(sample.querySelector('.ability-panel'));
}
</script></html>
