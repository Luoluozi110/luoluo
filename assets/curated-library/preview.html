<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>《文心棋》素材候选库</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4eddd;
      --paper-2: #e7dbc2;
      --ink: #432c24;
      --muted: #76645a;
      --cinnabar: #9c3d32;
      --gold: #b58b48;
      --line: rgba(67, 44, 36, .18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 8%, rgba(181, 139, 72, .15), transparent 26rem),
        linear-gradient(135deg, var(--paper), #f9f4e9 48%, var(--paper-2));
      font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
    }
    main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 44px 0 72px; }
    header { display: grid; gap: 10px; margin-bottom: 34px; border-bottom: 1px solid var(--line); padding-bottom: 24px; }
    h1, h2 { margin: 0; font-weight: 650; letter-spacing: .08em; }
    h1 { font-size: clamp(28px, 5vw, 48px); }
    h2 { margin-top: 36px; font-size: 24px; }
    p { margin: 0; line-height: 1.8; color: var(--muted); }
    .badges { display: flex; flex-wrap: wrap; gap: 8px; }
    .badge { border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; background: rgba(255,255,255,.38); font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
    .icon-card, .sound-card {
      border: 1px solid var(--line);
      background: rgba(255, 252, 244, .72);
      border-radius: 14px;
      box-shadow: 0 10px 26px rgba(72, 45, 30, .06);
    }
    .icon-card { min-height: 166px; padding: 16px; display: grid; place-items: center; align-content: center; gap: 12px; text-align: center; }
    .icon-card img { width: 72px; height: 72px; object-fit: contain; }
    .icon-card.kenney .icon-well { width: 88px; height: 88px; display: grid; place-items: center; border-radius: 50%; background: var(--ink); }
    .icon-card.kenney img { width: 58px; height: 58px; }
    .name { font: 600 13px/1.4 system-ui, sans-serif; overflow-wrap: anywhere; }
    .source { color: var(--muted); font: 12px/1.4 system-ui, sans-serif; }
    .sound-list { display: grid; gap: 12px; margin-top: 16px; }
    .sound-card { padding: 15px 16px; display: grid; grid-template-columns: minmax(180px, 1fr) minmax(250px, 2fr); gap: 16px; align-items: center; }
    audio { width: 100%; height: 36px; }
    .review { border-color: rgba(156, 61, 50, .48); background: rgba(156, 61, 50, .06); }
    .notice { margin-top: 26px; padding: 16px 18px; border-left: 4px solid var(--cinnabar); background: rgba(255,255,255,.4); }
    a { color: var(--cinnabar); }
    @media (max-width: 650px) { .sound-card { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <header>
    <div class="badges"><span class="badge">22 枚图标</span><span class="badge">12 条生产候选</span><span class="badge">1 条试听参考</span></div>
    <h1>《文心棋》素材候选库</h1>
    <p>本页完全离线，不加载第三方脚本。先看语义与风格，再试听音效；授权详情见 <a href="SOURCES.md">SOURCES.md</a>。</p>
  </header>

  <h2>Game-icons.net · 墨色 SVG</h2>
  <div class="grid" id="gameIcons"></div>

  <h2>Kenney · 白色棋盘图标</h2>
  <div class="grid" id="kenneyIcons"></div>

  <h2>可用于生产的音效候选</h2>
  <div class="sound-list" id="candidateAudio"></div>

  <h2>仅供选型试听</h2>
  <div class="sound-list" id="reviewAudio"></div>

  <p class="notice">Freesound 试听文件为公开低码率预览。若选中该声音，请从来源页登录下载原始 WAV，再做裁切、响度与格式转换。</p>
</main>
<script>
  const gameIcons = [
    ['quill-ink.svg', '文心 / 创作', 'Lorc'], ['open-book.svg', '图鉴 / 题库', 'Lorc'],
    ['scroll-unfurled.svg', '奇遇 / 文书', 'Lorc'], ['ink-swirl.svg', '灵感 / 墨韵', 'Lorc'],
    ['brainstorm.svg', '创意 / 天赋', 'Lorc'], ['laurels.svg', '名望 / 胜利', 'Lorc'],
    ['lotus.svg', '诗意 / 境界', 'Lorc'], ['sunrise.svg', '天象 / 晴', 'Lorc'],
    ['raining.svg', '天象 / 雨', 'Lorc'], ['hourglass.svg', '计时', 'Lorc'],
    ['trophy.svg', '榜单 / 胜利', 'Lorc'], ['dice-six-faces-six.svg', '掷骰', 'Delapouite'],
    ['speaker.svg', '声音', 'Delapouite'], ['musical-notes.svg', '音乐', 'Delapouite']
  ];
  const kenneyIcons = [
    ['book_open.png', '图鉴 / 题库'], ['award.png', '品级 / 奖励'], ['dice.png', '掷骰'],
    ['pawn.png', '棋子'], ['hourglass.png', '计时'], ['character.png', '角色'],
    ['crown_a.png', '晋级 / 胜利'], ['cards_stack.png', '奇遇牌堆']
  ];
  const candidateAudio = [
    ['audio/kenney-ui/click1.ogg', '普通按键 1', 'Kenney · CC0'],
    ['audio/kenney-ui/click2.ogg', '普通按键 2', 'Kenney · CC0'],
    ['audio/kenney-ui/mouseclick1.ogg', '按下', 'Kenney · CC0'],
    ['audio/kenney-ui/mouserelease1.ogg', '松开', 'Kenney · CC0'],
    ['audio/kenney-ui/switch1.ogg', '切换 1', 'Kenney · CC0'],
    ['audio/kenney-ui/switch17.ogg', '切换 17', 'Kenney · CC0'],
    ['audio/opengameart-paper/paper-sound-1.mp3', '纸张 1', 'Luckius · CC0'],
    ['audio/opengameart-paper/paper-sound-2.mp3', '纸张 2', 'Luckius · CC0'],
    ['audio/opengameart-paper/paper-sound-3.mp3', '纸张 3', 'Luckius · CC0'],
    ['audio/opengameart-paper/paper-sound-4.mp3', '纸张 4', 'Luckius · CC0'],
    ['audio/opengameart-dice/wooden-dice-1.flac', '木骰落桌 1', 'Wuzzy · CC0'],
    ['audio/opengameart-dice/wooden-dice-3.flac', '木骰落桌 3', 'Wuzzy · CC0']
  ];
  const reviewAudio = [
    ['audio/review-only/freesound-235489-dice-roll-preview-lq.mp3', '双骰木桌（低码率预览）', 'ekfink · CC0 · review-only']
  ];
  const iconCard = (base, row, klass = '') => `<article class="icon-card ${klass}"><div class="icon-well"><img src="${base}/${row[0]}" alt="${row[1]}图标"></div><div><div class="name">${row[1]}</div><div class="source">${row[0]}${row[2] ? ` · ${row[2]}` : ''}</div></div></article>`;
  const soundCard = (row, review = false) => `<article class="sound-card ${review ? 'review' : ''}"><div><div class="name">${row[1]}</div><div class="source">${row[2]} · ${row[0]}</div></div><audio controls preload="metadata" src="${row[0]}"></audio></article>`;
  document.querySelector('#gameIcons').innerHTML = gameIcons.map(row => iconCard('icons/game-icons', row)).join('');
  document.querySelector('#kenneyIcons').innerHTML = kenneyIcons.map(row => iconCard('icons/kenney-board-game-icons', row, 'kenney')).join('');
  document.querySelector('#candidateAudio').innerHTML = candidateAudio.map(row => soundCard(row)).join('');
  document.querySelector('#reviewAudio').innerHTML = reviewAudio.map(row => soundCard(row, true)).join('');
</script>
</body>
</html>
