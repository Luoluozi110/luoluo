<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>流派选择预览</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/board.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px;
      background: var(--xuanzhi);
    }
    .preview-hdr {
      text-align: center;
      margin-bottom: 26px;
    }
    .preview-hdr h1 {
      font-family: var(--font-kai);
      font-size: 36px;
      letter-spacing: .25em;
      margin: 0 0 8px;
    }
    .preview-hdr p {
      color: var(--mo-3);
      letter-spacing: .1em;
      margin: 0;
    }
    .preview-grid {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 1100px;
    }
    /* 复用 .school-card 样式，其余由 ui.css 提供 */
  </style>
</head>
<body>
  <div class="preview-hdr">
    <h1>選 擇 流 派</h1>
    <p>三派各有所长，落子无悔，且赴科场。</p>
  </div>
  <div class="preview-grid" id="cards"></div>

  <script type="module">
    const EMBLEM = {
      xue: `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="ta-vol" cx="35%" cy="30%" r="78%"><stop offset="0%" stop-color="#fff" stop-opacity=".45"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><g stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="28" fill="#f2ecdc" stroke="#9d8250" stroke-width="3"/><circle cx="32" cy="32" r="28" fill="url(#ta-vol)"/><path d="M14 20h16v26H14zM34 20h16v26H34z" fill="#e0cf9f" stroke="#9d8250" stroke-width="2"/><path d="M32 18v30" stroke="#9d8250" stroke-width="3"/></g></svg>`,
      si: `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="ta-vol" cx="35%" cy="30%" r="78%"><stop offset="0%" stop-color="#fff" stop-opacity=".45"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><g stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="28" fill="#eee6f6" stroke="#7a5aa8" stroke-width="3"/><circle cx="32" cy="32" r="28" fill="url(#ta-vol)"/><path d="M32 12l5 12 12 2-9 8 3 13-11-7-11 7 3-13-9-8 12-2z" fill="#a98fd0" stroke="#7a5aa8" stroke-width="2"/></g></svg>`,
      bi: `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="ta-vol" cx="35%" cy="30%" r="78%"><stop offset="0%" stop-color="#fff" stop-opacity=".45"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><g stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="28" fill="#fdf3e2" stroke="#6b5d4c" stroke-width="3"/><circle cx="32" cy="32" r="28" fill="url(#ta-vol)"/><path d="M40 14c-2 4-5 7-8 10l-2 2 6 6 3-2c3-2 5-6 7-8-1-4-4-7-6-8z" fill="#33302a" stroke="#6b5d4c" stroke-width="2"/><path d="M30 27l7 7-13 13c-2 2-6 2-8-1 3-2 2-5 0-8l-1 0c1-5 6-8 10-8l5-3z" fill="#cf6486" stroke="#6b5d4c" stroke-width="2"/></g></svg>`
    };

    const schools = [
      {
        id: 'bowen', name: '博闻', attr: 'xue', talentName: '博览',
        motto: '博观约取，厚积薄发',
        flavor: '你自幼好读，藏书万卷皆在腹中。科场之上，你能引百家之言以佐己论，举一隅而三隅反——胸中学问，便是你挥之不尽的底气。',
        bonus: '入门 学力 +3'
      },
      {
        id: 'qishi', name: '奇士', attr: 'si', talentName: '推敲',
        motto: '灵台澄澈，万象皆明',
        flavor: '你生性爱钻牛角尖，常于无人处反复推敲。奇思往往不循常理，却能于困局中另辟蹊径——想人之所未想，故能成人之所不能成。',
        bonus: '入门 思力 +3'
      },
      {
        id: 'cizong_bi', name: '辞宗', attr: 'bi', talentName: '入木三分',
        motto: '笔落惊风雨，文成绣山川',
        flavor: '你惜墨如金，落笔却字字千金。洋洋千言一挥而就，旁人苦吟终日的篇章，于你不过是砚池里一次起兴。文思如潮涌，胸中自有丘壑。',
        bonus: '入门 笔力 +3'
      }
    ];

    document.getElementById('cards').innerHTML = schools.map(sch => `
      <button class="school-card" data-id="${sch.id}">
        <div class="emblem">${EMBLEM[sch.attr]}</div>
        <h3>${sch.name}</h3>
        <div class="motto">${sch.motto}</div>
        <div class="flavor">${sch.flavor}</div>
        <div class="meta">${sch.bonus} · 初授文心「${sch.talentName}」</div>
      </button>
    `).join('');
  </script>
</body>
</html>
